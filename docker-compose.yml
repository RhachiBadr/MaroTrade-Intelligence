services:
  marotrade:
    build: .
    container_name: marotrade-intelligence
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/marotrade_db?schema=public
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: marotrade-frontend
    working_dir: /app/marotrade-frontend
    env_file: docker.env
    volumes:
      - .:/app
      - /app/marotrade-frontend/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      marotrade:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    container_name: marotrade-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: marotrade_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marotrade_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: marotrade-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@marotrade.ma
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

  prisma-studio:
    image: node:20-alpine
    container_name: marotrade-prisma-studio
    working_dir: /app
    env_file: docker.env
    volumes:
      - .:/app
    ports:
      - "5555:5555"
    command: sh -c "npx prisma studio --browser none"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
