services:
  marotrade:
    build: .
    container_name: marotrade-intelligence
    ports:
      - "8501:8501"
    volumes:
      - .:/app   # Recharge le code en temps réel (utile en dev)
    restart: unless-stopped
    depends_on:
      - postgres

  frontend:
    image: node:20-alpine
    container_name: marotrade-frontend
    working_dir: /app/marotrade-frontend
    volumes:
      - .:/app
      - /app/marotrade-frontend/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - marotrade

  postgres:
    image: postgres:15-alpine
    container_name: marotrade-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: marotrade_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
